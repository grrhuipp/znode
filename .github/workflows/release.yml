name: Autobuild

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.15.2
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build znode
        run: zig build -Doptimize=ReleaseFast -Dtarget=x86_64-linux-musl

      - name: Package
        run: |
          mkdir -p dist
          cp zig-out/bin/znode dist/znode-linux-amd64
          chmod +x dist/znode-linux-amd64
          cd dist && tar czf znode-linux-amd64.tar.gz znode-linux-amd64

      - name: Upload autobuild release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete autobuild --yes --cleanup-tag 2>/dev/null || true
          gh release create autobuild dist/znode-linux-amd64.tar.gz \
            --title "Autobuild" \
            --notes "自动构建 (main branch)

          Commit: ${{ github.sha }}" \
            --prerelease
