name: Autobuild

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - optimize: Debug
            suffix: debug
          - optimize: ReleaseFast
            suffix: fast
          - optimize: ReleaseSafe
            suffix: safe
          - optimize: ReleaseSmall
            suffix: small

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.15.2
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build znode (${{ matrix.optimize }})
        run: zig build -Doptimize=${{ matrix.optimize }} -Dtarget=x86_64-linux-musl

      - name: Package
        run: |
          mkdir -p dist
          cp zig-out/bin/znode dist/znode-linux-amd64-${{ matrix.suffix }}
          chmod +x dist/znode-linux-amd64-${{ matrix.suffix }}
          cd dist && tar czf znode-linux-amd64-${{ matrix.suffix }}.tar.gz znode-linux-amd64-${{ matrix.suffix }}

      - uses: actions/upload-artifact@v4
        with:
          name: znode-${{ matrix.suffix }}
          path: dist/znode-linux-amd64-${{ matrix.suffix }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload autobuild release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete autobuild --yes --cleanup-tag -R ${{ github.repository }} 2>/dev/null || true
          gh release create autobuild artifacts/*.tar.gz \
            -R ${{ github.repository }} \
            --title "Autobuild" \
            --notes "自动构建 (main branch)

          Commit: ${{ github.sha }}

          | 文件 | 说明 |
          |------|------|
          | znode-linux-amd64-fast.tar.gz | ReleaseFast (推荐生产使用) |
          | znode-linux-amd64-safe.tar.gz | ReleaseSafe (含安全检查) |
          | znode-linux-amd64-small.tar.gz | ReleaseSmall (最小体积) |
          | znode-linux-amd64-debug.tar.gz | Debug (调试用) |" \
            --prerelease
