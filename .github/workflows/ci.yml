name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.15.2
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Check x86_64-linux
        run: zig build check -Dtarget=x86_64-linux

      - name: Check aarch64-linux
        run: zig build check -Dtarget=aarch64-linux

  build:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.15.2
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Build aws-lc (musl via zig cc)
        run: |
          git clone --depth 1 --branch main https://github.com/aws/aws-lc.git /tmp/aws-lc-src

          mkdir -p /tmp/zigcc
          cat > /tmp/zigcc/zigcc <<'ZIGCC'
          #!/bin/bash
          zig cc -target x86_64-linux-musl $@
          ZIGCC
          cat > /tmp/zigcc/zigcxx <<'ZIGCXX'
          #!/bin/bash
          zig c++ -target x86_64-linux-musl $@
          ZIGCXX
          chmod +x /tmp/zigcc/zigcc /tmp/zigcc/zigcxx

          mkdir -p /tmp/aws-lc-build
          cd /tmp/aws-lc-build
          cmake /tmp/aws-lc-src \
            -GNinja \
            -DCMAKE_C_COMPILER=/tmp/zigcc/zigcc \
            -DCMAKE_CXX_COMPILER=/tmp/zigcc/zigcxx \
            -DCMAKE_ASM_COMPILER=/tmp/zigcc/zigcc \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=x86_64 \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTING=OFF \
            -DDISABLE_GO=ON \
            -DDISABLE_PERL=ON \
            -DCMAKE_ASM_FLAGS="-target x86_64-linux-musl"

          ninja crypto ssl

          mkdir -p $GITHUB_WORKSPACE/deps/aws-lc/lib/x86_64-linux
          cp crypto/libcrypto.a $GITHUB_WORKSPACE/deps/aws-lc/lib/x86_64-linux/
          cp ssl/libssl.a $GITHUB_WORKSPACE/deps/aws-lc/lib/x86_64-linux/

      - name: Build (ReleaseFast)
        run: zig build -Doptimize=ReleaseFast -Dtarget=x86_64-linux
