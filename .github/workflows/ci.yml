name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.15.2
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Check x86_64-linux
        run: zig build check -Dtarget=x86_64-linux

      - name: Check aarch64-linux
        run: zig build check -Dtarget=aarch64-linux

