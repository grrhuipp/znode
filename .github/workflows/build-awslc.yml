name: Build aws-lc

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-awslc:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-linux-musl
            arch: x86_64
            lib_dir: x86_64-linux-musl
          - target: x86_64-linux-gnu
            arch: x86_64
            lib_dir: x86_64-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.15.2
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Clone aws-lc
        run: |
          git clone --depth 1 --branch main https://github.com/aws/aws-lc.git /tmp/aws-lc-src
          # Remove flags unsupported by zig cc
          sed -i 's/-Wp,-U_FORTIFY_SOURCE//g' /tmp/aws-lc-src/third_party/jitterentropy/CMakeLists.txt

      - name: Build aws-lc (${{ matrix.target }})
        env:
          ZIG_TARGET: ${{ matrix.target }}
        run: |
          mkdir -p /tmp/zigcc
          printf '#!/bin/bash\nexec zig cc -target %s "$@"\n' "$ZIG_TARGET" > /tmp/zigcc/zigcc
          printf '#!/bin/bash\nexec zig c++ -target %s "$@"\n' "$ZIG_TARGET" > /tmp/zigcc/zigcxx
          chmod +x /tmp/zigcc/zigcc /tmp/zigcc/zigcxx

          mkdir -p /tmp/aws-lc-build
          cd /tmp/aws-lc-build
          cmake /tmp/aws-lc-src \
            -GNinja \
            -DCMAKE_C_COMPILER=/tmp/zigcc/zigcc \
            -DCMAKE_CXX_COMPILER=/tmp/zigcc/zigcxx \
            -DCMAKE_ASM_COMPILER=/tmp/zigcc/zigcc \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.arch }} \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTING=OFF \
            -DDISABLE_GO=ON \
            -DDISABLE_PERL=ON \
            -DCMAKE_C_FLAGS="-fno-sanitize=all" \
            -DCMAKE_CXX_FLAGS="-fno-sanitize=all" \
            -DCMAKE_ASM_FLAGS="-target ${{ matrix.target }}"

          ninja crypto ssl

      - name: Copy libs
        run: |
          LIB_DIR=deps/aws-lc/lib/${{ matrix.lib_dir }}
          mkdir -p $LIB_DIR
          cp /tmp/aws-lc-build/crypto/libcrypto.a $LIB_DIR/
          cp /tmp/aws-lc-build/ssl/libssl.a $LIB_DIR/

      - uses: actions/upload-artifact@v4
        with:
          name: awslc-${{ matrix.lib_dir }}
          path: deps/aws-lc/lib/${{ matrix.lib_dir }}

  commit:
    needs: build-awslc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: awslc-x86_64-linux-musl
          path: deps/aws-lc/lib/x86_64-linux-musl

      - uses: actions/download-artifact@v4
        with:
          name: awslc-x86_64-linux-gnu
          path: deps/aws-lc/lib/x86_64-linux-gnu

      - name: Commit libs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deps/aws-lc/lib/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: rebuild aws-lc static libs (musl + gnu, zig cc)"
            git pull --rebase
            git push
          fi
